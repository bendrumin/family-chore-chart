<!doctype html><html><head><meta charset="utf-8"><style>
/* General (non-Duo) product page header, 16:9 at 5244x2950.
   Render: see render-general.sh. Sources live in src-general/. */
html,body{margin:0;width:5244px;height:2950px;overflow:hidden}
body{background:linear-gradient(165deg,#eef6f6 0%,#f6f2f6 50%,#fdf0ec 100%);font-family:-apple-system,"SF Pro Display",system-ui,sans-serif;position:relative}
.glow{position:absolute;border-radius:50%;filter:blur(220px);opacity:.55}
.g1{width:2200px;height:2200px;left:2800px;top:-600px;background:#c9b8f5}
.g2{width:1800px;height:1800px;left:-300px;top:1500px;background:#ffd7b8}
.copy{position:absolute;left:330px;top:0;bottom:0;width:2100px;display:flex;flex-direction:column;justify-content:center}
.icon{width:400px;height:400px;border-radius:90px;box-shadow:0 40px 90px rgba(14,58,64,.22);margin-bottom:110px}
h1{margin:0;font-size:250px;line-height:1.02;font-weight:800;color:#143c40;letter-spacing:-6px}
h1 span{background:linear-gradient(90deg,#6366f1,#8b5cf6);-webkit-background-clip:text;color:transparent}
p{margin:80px 0 0;font-size:96px;line-height:1.3;font-weight:500;color:#51666a}
.dev{position:absolute;overflow:hidden;box-shadow:0 60px 160px rgba(14,58,64,.28),0 0 0 22px #1b1b1f,0 0 0 26px #3a3a40}
.dev img{display:block;width:100%}
.ipad{width:1980px;left:2900px;top:330px;border-radius:120px}
.phone{width:1100px;left:2200px;top:760px;border-radius:150px;box-shadow:0 70px 180px rgba(14,58,64,.36),0 0 0 22px #1b1b1f,0 0 0 26px #3a3a40}
</style></head><body>
<div class="glow g1"></div><div class="glow g2"></div>
<div class="copy">
  <img class="icon" src="src-general/icon.png">
  <h1>Chores kids<br><span>actually finish.</span></h1>
  <p>Routines, allowance, and a pet<br>that grows with every chore.</p>
</div>
<div class="dev ipad"><img src="src-general/ipad-pet.png"></div>
<div class="dev phone"><img src="src-general/phone-home.png"></div>
</body></html>
